name: Docker image

# Builds the image on every change to it, and publishes it to the GitHub Container
# Registry when a release is published: ghcr.io/frkndncr/webanalyzer
on:
  push:
    branches: [main]
    paths: [Dockerfile, .dockerignore, requirements.txt, ".github/workflows/docker.yml"]
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'release'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/frkndncr/webanalyzer
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}

      - name: Build (and push on release)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'release' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        if: github.event_name != 'release'
        run: |
          docker build -t webanalyzer-ci .
          docker run --rm webanalyzer-ci python cli.py version
          docker run --rm webanalyzer-ci python cli.py modules
